<!-- 3D Canvas Engine -->
<script>
  (function init3DEmbers() {
    const canvas = document.getElementById('emberCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');

    const resize = () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    };
    resize();
    window.addEventListener('resize', resize);

    const particles = Array.from({ length: 60 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      z: Math.random() * 1000,
      size: Math.random() * 2.5 + 1,
      speedY: Math.random() * 0.8 + 0.3,
      opacity: Math.random() * 0.7 + 0.3,
      color: Math.random() > 0.4 ? '#e3a23c' : Math.random() > 0.5 ? '#f2c879' : '#c1503c'
    }));

    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach((p) => {
        p.y -= p.speedY;
        if (p.y < -20) {
          p.y = canvas.height + 20;
          p.x = Math.random() * canvas.width;
        }
        const scale = 800 / (800 + p.z);
        const x = (p.x - canvas.width / 2) * scale + canvas.width / 2;
        const y = (p.y - canvas.height / 2) * scale + canvas.height / 2;
        ctx.beginPath();
        ctx.arc(x, y, p.size * scale * 1.5, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.opacity * (1 - p.z / 1000);
        ctx.shadowBlur = 10 * scale;
        ctx.shadowColor = p.color;
        ctx.fill();
        ctx.shadowBlur = 0;
      });
      requestAnimationFrame(loop);
    }
    loop();
  })();
</script>

              </svg>
              <svg className="absolute inset-0 w-full h-full transform -rotate-90">
                <circle cx="88" cy="88" r="80" fill="none" stroke="#1a110a" strokeWidth="4" />

            <div className="w-56 h-1.5 bg-[#1f130b] rounded-full overflow-hidden mb-2 border border-[#f5ecdc]/10">

            </div>

          </div>

        {/* Header */}

          <div className="max-w-7xl mx-auto flex items-center justify-between">
            <a href="#top">
              <RealBrandLogo />
            </a>

            <nav className="hidden md:flex items-center gap-8 text-sm text-[#c9b59c]">
              <a href="#maps-choice" className="hover:text-[#e3a23c]">Top Suggested</a>
              <a href="#about" className="hover:text-[#e3a23c]">Story</a>
              <a href="#menu" className="hover:text-[#e3a23c]">Menu</a>
              <a href="#instagram" className="hover:text-[#e3a23c] text-[#e3a23c] flex items-center gap-1.5">

            <div className="flex items-center gap-3">

                className="px-4 py-2 rounded-full bg-gradient-to-r from-purple-900/60 to-pink-900/60 border border-pink-500/30 text-pink-300 hover:text-white hover:border-pink-400 flex items-center gap-2 text-xs font-mono transition-all shadow-md"

          </div>
        </header>

        {/* Hero */}
        <section id="top" className="relative pt-36 pb-24 md:pt-48 md:pb-36 min-h-screen flex items-center overflow-hidden">

            <div className="inline-block px-4 py-1.5 rounded-full bg-emerald-950/60 border border-emerald-500/30 text-emerald-400 text-xs font-mono tracking-wider uppercase mb-6">
              ● OPEN DAILY • Dum Counter Active (11:30 AM Onwards)

            <p className="text-lg md:text-2xl text-[#c9b59c] max-w-2xl leading-relaxed mb-10 font-light">

            </p>

            <div className="flex flex-wrap items-center gap-4 mb-14">
              <a href="#maps-choice" className="px-8 py-4 rounded-full bg-gradient-to-r from-[#e3a23c] to-[#c4832a] text-[#140c08] font-bold text-sm uppercase shadow-xl hover:scale-105 transition-all">

                <InstagramSvgIcon className="w-4 h-4 text-pink-400" /> Follow {INSTAGRAM_HANDLE} ↗

        </section>

          <div className="max-w-7xl mx-auto px-6">
            <div className="text-center max-w-3xl mx-auto mb-16">

              <h2 className="font-serif text-3xl md:text-5xl font-bold text-[#f5ecdc] mb-4">Top Suggested Dishes</h2>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
              {TOP_MAPS_SUGGESTED_DISHES.map((dish) => (
                <div key={dish.id} className="tilt-card preserve-3d rounded-3xl overflow-hidden bg-[#1a110a] border border-[#f5ecdc]/15 shadow-2xl p-6 flex flex-col justify-between">
                  <div>
                    <div className="relative h-56 rounded-2xl overflow-hidden mb-6">

                        {dish.highlight}
                      </div>
                      <div className="absolute bottom-3 right-3 px-3 py-1 rounded-full bg-[#e3a23c] text-[#140c08] font-serif font-bold text-sm">
                        ₹{dish.price}
                      </div>
                    </div>
                    <h3 className="font-serif font-bold text-xl text-[#f5ecdc] mb-3">{dish.name}</h3>

          <div className="max-w-7xl mx-auto px-6">
            <div className="text-center max-w-3xl mx-auto mb-16">
              <span className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-gradient-to-r from-purple-900/60 to-pink-900/60 border border-pink-500/30 text-pink-400 font-mono text-xs uppercase tracking-wider mb-3">
                <InstagramSvgIcon className="w-4 h-4 text-pink-400" /> Official Instagram Feed • {INSTAGRAM_HANDLE}
              </span>
              <h2 className="font-serif text-3xl md:text-5xl font-bold text-[#f5ecdc] mb-4">Behind the Scenes at JD's Kitchen</h2>
              <p className="text-[#c9b59c] font-light text-base">Daily dum reveals, timber courtyard vibes &amp; customer stories from @jdskitchen.official</p>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">

                  <div>
                    <div className="relative h-60 rounded-2xl overflow-hidden mb-5">
                      <ImageWithFallback src={post.image} fallbackSrc="./images/jds_biryani_hero_1786025415940.jpg" alt="Instagram Post" className="w-full h-full object-cover" />
                      <div className="absolute top-3 left-3 px-3 py-1 rounded-full bg-[#0d0805]/90 border border-pink-500/40 text-pink-400 font-mono text-[10px] font-bold flex items-center gap-1.5">
                        <InstagramSvgIcon className="w-3.5 h-3.5 text-pink-400" /> {post.tag}
                      </div>
                    </div>
                    <div className="flex items-center gap-2 mb-2">
                      <InstagramSvgIcon className="w-3.5 h-3.5 text-pink-500" />
                      <span className="font-mono text-xs text-[#e3a23c] font-bold">{INSTAGRAM_HANDLE}</span>
                    </div>
                    <p className="text-xs text-[#c9b59c] font-light leading-relaxed mb-4">{post.caption}</p>
                  </div>
                  <div className="pt-4 border-t border-[#f5ecdc]/10 flex items-center justify-between text-xs font-mono text-[#c9b59c]">
                    <span className="text-pink-400">❤️ {post.likes}</span>
                    <a href={INSTAGRAM_URL} target="_blank" rel="noreferrer" className="text-[#e3a23c] font-bold hover:underline">View Post ↗</a>
                  </div>
                </div>
              ))}
            </div>

            <div className="text-center mt-12">
              <a href={INSTAGRAM_URL} target="_blank" rel="noreferrer" className="inline-flex items-center gap-2.5 px-8 py-4 rounded-full bg-gradient-to-r from-purple-700 via-pink-600 to-amber-500 text-[#f5ecdc] font-bold text-xs uppercase shadow-xl hover:scale-105 transition-transform">
                <InstagramSvgIcon className="w-4 h-4 text-white" /> Follow @jdskitchen.official on Instagram ↗
              </a>
            </div>
          </div>
        </section>

        {/* Story Section */}
        <section id="about" className="py-24 max-w-7xl mx-auto px-6">
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
            <div className="lg:col-span-6">
              <span className="font-mono text-xs uppercase text-[#e3a23c] block mb-3">Why Regulars Return</span>
              <h2 className="font-serif text-3xl md:text-5xl font-bold text-[#f5ecdc] mb-6">The subtle details Kozhikode genuinely talks about.</h2>
              <p className="text-[#c9b59c] text-base leading-relaxed mb-8 font-light">
                Located along Parambath Road in Paloramala, Kozhikode, JD's Kitchen preservation of authentic slow dum-cooking and spacious courtyard dining sets us apart.
              </p>
            </div>

            <div className="lg:col-span-6">
              <div className="tilt-card preserve-3d rounded-3xl overflow-hidden border border-[#f5ecdc]/15 shadow-2xl relative">
                <ImageWithFallback src={REAL_JDS_COURTYARD_PHOTO} fallbackSrc="./images/jds_courtyard_1786025445110.jpg" alt="Courtyard Real Photo" className="w-full h-[450px] object-cover" />
              </div>
            </div>
          </div>
        </section>

        {/* COMBINED CONTACT, ORDER & TACTICAL MAPS SECTION */}
        <section id="contact-order" className="py-24 bg-[#0d0805] border-t border-[#f5ecdc]/10 relative z-10">
          <div className="max-w-7xl mx-auto px-6">
            <div className="text-center max-w-3xl mx-auto mb-16">
              <span className="font-mono text-xs uppercase tracking-[0.25em] text-[#e3a23c] block mb-3">📍 Contact &amp; Direct Order Counter</span>
              <h2 className="font-serif text-3xl md:text-5xl font-bold text-[#f5ecdc] mb-4">Place Your Order or Find Us</h2>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-12 items-start">
              <div className="lg:col-span-5 space-y-6">
                <div className="p-8 rounded-3xl bg-[#1a110a] border border-[#e3a23c]/30 shadow-2xl space-y-6">
                  <h3 className="font-serif text-2xl font-bold text-[#f5ecdc]">Direct WhatsApp Order</h3>
                  <form onSubmit={handleOrderSubmit} className="space-y-4">
                    <input type="text" required placeholder="Your Name" value={orderForm.name} onChange={(e) => setOrderForm({ ...orderForm, name: e.target.value })} className="w-full px-4 py-3 rounded-xl bg-[#0d0805] border border-[#f5ecdc]/20 text-sm text-[#f5ecdc]" />
                    <input type="tel" required placeholder="Phone Number" value={orderForm.phone} onChange={(e) => setOrderForm({ ...orderForm, phone: e.target.value })} className="w-full px-4 py-3 rounded-xl bg-[#0d0805] border border-[#f5ecdc]/20 text-sm text-[#f5ecdc]" />
                    <select value={orderForm.item} onChange={(e) => setOrderForm({ ...orderForm, item: e.target.value })} className="w-full px-4 py-3 rounded-xl bg-[#0d0805] border border-[#f5ecdc]/20 text-sm text-[#f5ecdc]">
                      {MENU_ITEMS.map((item) => (
                        <option key={item.id} value={item.name}>{item.name} - ₹{item.price}</option>
                      ))}
                    </select>
                    <button type="submit" className="w-full py-4 rounded-xl bg-[#e3a23c] text-[#140c08] font-bold text-xs uppercase">
                      Send Order to WhatsApp ➔
                    </button>
                  </form>
                </div>
              </div>

              <div className="lg:col-span-7">
                <div className="tilt-card preserve-3d h-[520px] rounded-3xl overflow-hidden border border-[#f5ecdc]/20 shadow-2xl bg-[#120a06] relative">
                  <iframe title="Google Map" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3912.8!2d75.7591583!3d11.3539638!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3ba65f84d39af2d7%3A0x474484ee5ed2bbe9!2sJD&#39;s%20Kitchen!5e0!3m2!1sen!2sin!4v1700000000000!5m2!1sen!2sin" width="100%" height="100%" style={{ border: 0, filter: 'invert(90%) hue-rotate(180deg)' }} />
                </div>
              </div>
            </div>
          </div>
        </section>

        {/* Footer */}
        <footer className="py-12 bg-[#090503] text-center border-t border-[#f5ecdc]/10">
          <RealBrandLogo className="justify-center mb-4" />
          <p className="font-mono text-xs text-[#e3a23c] uppercase tracking-widest mb-6">Parambath • Kozhikode</p>
          <div className="flex items-center justify-center gap-4 mb-8">
            <a href={INSTAGRAM_URL} target="_blank" rel="noreferrer" className="inline-flex items-center gap-2 px-5 py-2.5 rounded-full bg-[#1a110a] border border-pink-500/30 text-pink-400 font-mono text-xs hover:bg-pink-950/60 hover:text-white transition-all">
              <InstagramSvgIcon className="w-4 h-4 text-pink-400" />
              <span>{INSTAGRAM_HANDLE}</span>
            </a>
          </div>
          <p className="text-xs text-[#c9b59c]/60">© {new Date().getFullYear()} JD's Kitchen. All rights reserved.</p>
        </footer>

      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
